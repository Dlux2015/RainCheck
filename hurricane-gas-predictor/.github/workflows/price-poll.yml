name: Gas Price Poll

on:
  schedule:
    # Every 30 minutes year-round — prices matter even without active storms
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  poll-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch latest EIA prices and upsert to Supabase
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'EOF'
          import os, httpx
          from datetime import datetime, timezone

          EIA_BASE = "https://api.eia.gov/v2/petroleum/pri/gnd/data/"
          SERIES = {
              "regular":  "EMM_EPMRR_PTE_R30_DPG",
              "midgrade": "EMM_EPMM_PTE_R30_DPG",
              "premium":  "EMM_EPMP_PTE_R30_DPG",
          }
          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          EIA_KEY      = os.environ["EIA_API_KEY"]

          # Use requests-style headers — avoids supabase Python client
          # and its typing_extensions dependency
          sb_headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "resolution=ignore-duplicates,return=minimal",
          }

          now  = datetime.now(timezone.utc).isoformat()
          rows = []

          for grade, series_id in SERIES.items():
              resp = httpx.get(EIA_BASE, params={
                  "api_key":             EIA_KEY,
                  "frequency":           "weekly",
                  "data[]":              "value",
                  "facets[series][]":    series_id,
                  "sort[0][column]":     "period",
                  "sort[0][direction]":  "desc",
                  "length":              1,
              }, timeout=30)
              resp.raise_for_status()
              data = resp.json().get("response", {}).get("data", [])
              if data and data[0].get("value") is not None:
                  rows.append({
                      "region":      "gulf-coast",
                      "grade":       grade,
                      "series":      series_id,
                      "period":      data[0]["period"],           # "YYYY-MM-DD"
                      "price_usd":   float(data[0]["value"]),
                      "ingested_at": now,
                  })

          if not rows:
              print("No price data returned from EIA")
              raise SystemExit(0)

          r = httpx.post(
              f"{SUPABASE_URL}/rest/v1/gas_prices",
              headers=sb_headers,
              json=rows,
          )
          r.raise_for_status()
          print(f"Upserted {len(rows)} price record(s) — periods: {[r['period'] for r in rows]}")
          EOF
