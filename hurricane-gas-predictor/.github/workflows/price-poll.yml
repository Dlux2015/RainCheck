name: Gas Price Poll

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  poll-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx supabase

      - name: Check storm flag and poll EIA if active
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'EOF'
          import os
          import httpx
          from datetime import datetime, timezone
          from supabase import create_client

          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])

          flag_resp = (
              sb.table("storm_flags")
                .select("active")
                .order("created_at", desc=True)
                .limit(1)
                .execute()
          )
          storm_active = flag_resp.data[0]["active"] if flag_resp.data else False
          print(f"Storm active flag: {storm_active}")

          if not storm_active:
              print("No active storm — skipping price poll")
              raise SystemExit(0)

          api_key = os.environ["EIA_API_KEY"]
          eia_base = "https://api.eia.gov/v2/petroleum/pri/gnd/data/"
          series = {
              "regular":  "EMM_EPMRR_PTE_R30_DPG",
              "midgrade": "EMM_EPMM_PTE_R30_DPG",
              "premium":  "EMM_EPMP_PTE_R30_DPG",
          }

          now = datetime.now(timezone.utc).isoformat()
          rows = []
          for grade, series_id in series.items():
              resp = httpx.get(
                  eia_base,
                  params={
                      "api_key": api_key,
                      "frequency": "weekly",
                      "data[]": "value",
                      "facets[series][]": series_id,
                      "sort[0][column]": "period",
                      "sort[0][direction]": "desc",
                      "length": 1,
                  },
                  timeout=30,
              )
              resp.raise_for_status()
              data = resp.json().get("response", {}).get("data", [])
              if data:
                  rows.append({
                      "region": "gulf-coast",
                      "grade": grade,
                      "price_usd": float(data[0]["value"]),
                      "ingested_at": now,
                  })

          if rows:
              sb.table("gas_prices").insert(rows).execute()
              print(f"Inserted {len(rows)} price record(s) to Supabase")
          EOF
